---
- name: Provision a fresh Ubuntu VPS for TaskFlow
  hosts: vps
  become: true
  gather_facts: true

  vars:
    deploy_user: deploy
    docker_apt_arch: "{{ 'amd64' if ansible_architecture == 'x86_64' else ansible_architecture }}"

  tasks:
    # ---------------------------------------------------------------------
    # 1. Update apt cache and upgrade all packages
    # ---------------------------------------------------------------------
    - name: Update apt cache
      apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Upgrade all packages to the latest version
      apt:
        upgrade: dist

    # ---------------------------------------------------------------------
    # 2. Install and enable UFW; allow only 22, 80, 443, 6443; deny the rest
    # ---------------------------------------------------------------------
    - name: Install UFW
      apt:
        name: ufw
        state: present

    - name: Set default UFW policy to deny incoming traffic
      community.general.ufw:
        direction: incoming
        default: deny

    - name: Set default UFW policy to allow outgoing traffic
      community.general.ufw:
        direction: outgoing
        default: allow

    - name: Allow SSH (22)
      community.general.ufw:
        rule: allow
        port: "22"
        proto: tcp

    - name: Allow HTTP (80)
      community.general.ufw:
        rule: allow
        port: "80"
        proto: tcp

    - name: Allow HTTPS (443)
      community.general.ufw:
        rule: allow
        port: "443"
        proto: tcp

    - name: Allow k3s API (6443)
      community.general.ufw:
        rule: allow
        port: "6443"
        proto: tcp

    - name: Enable UFW
      community.general.ufw:
        state: enabled

    # ---------------------------------------------------------------------
    # 3. Docker's official GPG key + apt repository, then docker-ce et al.
    # ---------------------------------------------------------------------
    - name: Install prerequisites for adding an apt repository over HTTPS
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present

    - name: Add Docker's official GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add the Docker apt repository
      apt_repository:
        repo: "deb [arch={{ docker_apt_arch }}] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        filename: docker
        state: present
        update_cache: true

    - name: Install Docker Engine and the Compose plugin
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Ensure Docker is enabled and running
      systemd:
        name: docker
        enabled: true
        state: started

    # ---------------------------------------------------------------------
    # 4. Non-root deploy user, added to the docker group
    # ---------------------------------------------------------------------
    - name: Create the deploy user
      user:
        name: "{{ deploy_user }}"
        shell: /bin/bash
        create_home: true
        groups: docker
        append: true
        state: present

    # ---------------------------------------------------------------------
    # 5. Install k3s via the official install script, guarded against
    #    reinstalling. There is no apt package or Ansible module for k3s;
    #    the project's own supported install path is this shell script, so
    #    shell is the right tool here rather than a module.
    # ---------------------------------------------------------------------
    - name: Install k3s (skipped if already installed)
      shell: curl -sfL https://get.k3s.io | sh -
      args:
        creates: /usr/local/bin/k3s

    # ---------------------------------------------------------------------
    # 6. Copy k3s.yaml into the deploy user's ~/.kube/config
    # ---------------------------------------------------------------------
    - name: Wait for k3s to write its kubeconfig
      wait_for:
        path: /etc/rancher/k3s/k3s.yaml
        state: present
        timeout: 60

    - name: Create ~/.kube directory for the deploy user
      file:
        path: "/home/{{ deploy_user }}/.kube"
        state: directory
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0700"

    - name: Copy k3s.yaml to the deploy user's kube config
      copy:
        src: /etc/rancher/k3s/k3s.yaml
        dest: "/home/{{ deploy_user }}/.kube/config"
        remote_src: true
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0600"

    # ---------------------------------------------------------------------
    # 7. Verification
    # ---------------------------------------------------------------------
    - name: Check Docker version
      command: docker --version
      register: docker_version
      changed_when: false

    - name: Check k3s node status as the deploy user (proves kubectl works without sudo)
      command: kubectl get nodes
      become: true
      become_user: "{{ deploy_user }}"
      environment:
        KUBECONFIG: "/home/{{ deploy_user }}/.kube/config"
      register: k3s_nodes
      changed_when: false

    - name: Show Docker version
      debug:
        var: docker_version.stdout

    - name: Show k3s nodes
      debug:
        var: k3s_nodes.stdout_lines
