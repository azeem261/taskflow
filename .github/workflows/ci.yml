name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      auth-service: ${{ steps.filter.outputs.auth-service }}
      tasks-service: ${{ steps.filter.outputs.tasks-service }}
      analytics-service: ${{ steps.filter.outputs.analytics-service }}
      notifications-service: ${{ steps.filter.outputs.notifications-service }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            auth-service:
              - 'services/auth-service/**'
            tasks-service:
              - 'services/tasks-service/**'
            analytics-service:
              - 'services/analytics-service/**'
            notifications-service:
              - 'services/notifications-service/**'
            frontend:
              - 'services/frontend/**'

  build-and-push:
    needs: changes
    if: needs.changes.outputs[matrix.service] == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ steps.sha.outputs.short }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth-service
            runtime: python
            has_db: true
          - service: tasks-service
            runtime: python
            has_db: true
          - service: analytics-service
            runtime: python
            has_db: true
          - service: notifications-service
            runtime: python
            has_db: false
          - service: frontend
            runtime: node
            has_db: false
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    env:
      # Every service only reads its own prefixed var (AUTH_/TASKS_/ANALYTICS_);
      # setting all three unconditionally is simpler than wiring per-service names.
      AUTH_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test
      TASKS_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test
      ANALYTICS_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test
    steps:
      - uses: actions/checkout@v4

      - name: Short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: matrix.runtime == 'python'
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: services/${{ matrix.service }}/requirements.txt

      - uses: actions/setup-node@v4
        if: matrix.runtime == 'node'
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json

      - name: Install deps (python)
        if: matrix.runtime == 'python'
        run: pip install -r requirements.txt

      - name: Install deps (node)
        if: matrix.runtime == 'node'
        run: npm ci

      - name: Lint (python)
        if: matrix.runtime == 'python'
        run: ruff check . && black --check .

      - name: Lint (node)
        if: matrix.runtime == 'node'
        run: npm run lint

      - name: Alembic migrate (throwaway DB)
        if: matrix.has_db == true
        run: alembic upgrade head

      - name: Unit tests (python)
        if: matrix.runtime == 'python'
        run: pytest

      - name: Unit tests (node)
        if: matrix.runtime == 'node'
        run: npm test

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: services/${{ matrix.service }}
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Docker build
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          tags: ${{ matrix.service }}:${{ steps.sha.outputs.short }}
          load: true

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: ${{ matrix.service }}:${{ steps.sha.outputs.short }}
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag ${{ matrix.service }}:${{ steps.sha.outputs.short }} \
            ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}:${{ steps.sha.outputs.short }}
          docker push ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}:${{ steps.sha.outputs.short }}

  deploy:
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Copies the compose file fresh every run instead of relying on a
      # git clone living on the VPS — see PR/commit description for why.
      - name: Copy docker-compose.yml to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.yml"
          target: "~/taskflow"
          overwrite: true

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/taskflow && \
            IMAGE_TAG=${{ needs.build-and-push.outputs.sha }} docker compose pull && \
            IMAGE_TAG=${{ needs.build-and-push.outputs.sha }} docker compose up -d
