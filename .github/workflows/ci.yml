name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.matrix.outputs.services }}
    steps:
      - uses: actions/checkout@v4
        with:
          # paths-filter diffs against the parent commit on push events;
          # the default shallow (depth-1) checkout has no parent to diff
          # against, so every filter silently comes back false. Full
          # history (0) also covers pushes with more than one commit.
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            auth-service:
              - 'services/auth-service/**'
            tasks-service:
              - 'services/tasks-service/**'
            analytics-service:
              - 'services/analytics-service/**'
            notifications-service:
              - 'services/notifications-service/**'
            frontend:
              - 'services/frontend/**'

      # Job-level `if` can't see `matrix` (matrix only exists inside a job
      # that declares it), so instead of trying to skip matrix legs after
      # the fact, only create a leg for each service that actually changed.
      # Manual runs (workflow_dispatch) have no push diff to filter on, so
      # they force every service in, letting you exercise the full pipeline
      # (including deploy) on demand without touching service code.
      - name: Build matrix of changed services
        id: matrix
        run: |
          force="${{ github.event_name == 'workflow_dispatch' }}"
          services='[]'
          add() {
            if [ "$force" = "true" ] || [ "$2" = "true" ]; then
              services=$(echo "$services" | jq --arg s "$1" --arg r "$3" --argjson db "$4" \
                '. + [{service:$s, runtime:$r, has_db:$db}]')
            fi
          }
          add auth-service "${{ steps.filter.outputs.auth-service }}" python true
          add tasks-service "${{ steps.filter.outputs.tasks-service }}" python true
          add analytics-service "${{ steps.filter.outputs.analytics-service }}" python true
          add notifications-service "${{ steps.filter.outputs.notifications-service }}" python false
          add frontend "${{ steps.filter.outputs.frontend }}" node false
          echo "services=$(echo "$services" | jq -c .)" >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ steps.sha.outputs.short }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.services) }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    env:
      # Every service only reads its own prefixed var (AUTH_/TASKS_/ANALYTICS_);
      # setting all three unconditionally is simpler than wiring per-service names.
      AUTH_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test
      TASKS_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test
      ANALYTICS_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test
    steps:
      - uses: actions/checkout@v4

      - name: Short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: matrix.runtime == 'python'
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: services/${{ matrix.service }}/requirements.txt

      - uses: actions/setup-node@v4
        if: matrix.runtime == 'node'
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json

      - name: Install deps (python)
        if: matrix.runtime == 'python'
        run: pip install -r requirements.txt

      - name: Install deps (node)
        if: matrix.runtime == 'node'
        run: npm ci

      - name: Lint (python)
        if: matrix.runtime == 'python'
        run: ruff check . && black --check .

      - name: Lint (node)
        if: matrix.runtime == 'node'
        run: npm run lint

      - name: Alembic migrate (throwaway DB)
        if: matrix.has_db == true
        run: alembic upgrade head

      - name: Unit tests (python)
        if: matrix.runtime == 'python'
        run: pytest

      - name: Unit tests (node)
        if: matrix.runtime == 'node'
        run: npm test

      - name: Docker build
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          tags: ${{ matrix.service }}:${{ steps.sha.outputs.short }}
          load: true

      - name: Log in to GHCR
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        run: |
          # Path-filtering means not every service rebuilds on every push, so
          # deploy can't pin all 5 services to this run's SHA — a service
          # untouched by this commit would have no image at that tag. Always
          # also push `:latest` per service; deploy pulls `:latest` for
          # everything, which is always whatever that service last built.
          # The SHA tag stays too, for traceability/manual rollback.
          docker tag ${{ matrix.service }}:${{ steps.sha.outputs.short }} \
            ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}:${{ steps.sha.outputs.short }}
          docker tag ${{ matrix.service }}:${{ steps.sha.outputs.short }} \
            ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}:latest
          docker push ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}:${{ steps.sha.outputs.short }}
          docker push ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}:latest

  deploy:
    needs: build-and-push
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Copies the compose file fresh every run instead of relying on a
      # git clone living on the VPS — see PR/commit description for why.
      - name: Copy docker-compose.yml to VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.yml"
          target: "~/taskflow"
          overwrite: true

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # No IMAGE_TAG override here — docker-compose.yml's own default
          # (${IMAGE_TAG:-latest}) applies, so every service pulls its own
          # most recently pushed image rather than one shared SHA that not
          # all 5 services necessarily have (see Push image step above).
          script: |
            cd ~/taskflow && docker compose pull && docker compose up -d
