x-shared-jwt-secret: &jwt-secret dev-secret-change-me

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
        reservations:
          memory: 32M

  # Single Postgres server shared by all three services. Each service gets
  # its own logical database (auth / tasks / analytics) inside it rather
  # than its own container — one Postgres process to run and back up
  # instead of three, which matters on a small VPS, while each service
  # still only ever touches its own database.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auth
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
        reservations:
          memory: 256M

  auth-service:
    build: ./services/auth-service
    ports:
      - "8001:8000"
    environment:
      AUTH_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/auth
      AUTH_JWT_SECRET: *jwt-secret
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          memory: 128M

  tasks-service:
    build: ./services/tasks-service
    ports:
      - "8002:8000"
    environment:
      TASKS_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/tasks
      TASKS_JWT_SECRET: *jwt-secret
      TASKS_REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          memory: 128M

  notifications-service:
    build: ./services/notifications-service
    ports:
      - "8003:8000"
    environment:
      NOTIFICATIONS_REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          memory: 128M

  analytics-service:
    build: ./services/analytics-service
    ports:
      - "8004:8000"
    environment:
      ANALYTICS_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/analytics
      ANALYTICS_REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          memory: 128M

  frontend:
    build: ./services/frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_AUTH_URL: http://localhost:8001
      NEXT_PUBLIC_TASKS_URL: http://localhost:8002
    depends_on:
      auth-service:
        condition: service_healthy
      tasks-service:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
        reservations:
          memory: 256M

volumes:
  postgres-data:
